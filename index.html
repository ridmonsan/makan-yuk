<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffaf7">
<link rel="manifest" href="manifest.webmanifest">
<title>Makan Yuk ❤️</title>
<style>
:root{--bg:#fffaf7;--card:#fff;--text:#2f2a28;--muted:#8c817b;--line:#eee3dd;--accent:#d9786b;--accent2:#fce6e1;--shadow:0 10px 30px rgba(73,50,42,.08)}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fffaf7,#fff4ef);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
button{font:inherit}.app{width:min(100%,720px);margin:auto;padding:18px 14px 32px}
header{display:flex;justify-content:space-between;gap:12px;padding:10px 3px 14px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800}
h1{font-size:31px;letter-spacing:-.04em;margin:4px 0 0}.date{font-size:13px;color:var(--muted);margin-top:6px}.badge{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:15px;padding:10px 12px;font-size:12px;height:max-content}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:17px;margin-top:12px}
.section-title{font-size:16px;margin:0;font-weight:850}.section-sub{font-size:12px;color:var(--muted);margin:5px 0 13px}
.grid{display:grid;gap:9px}.meal-grid{grid-template-columns:repeat(2,1fr)}.food-grid{grid-template-columns:repeat(3,1fr)}.mood-grid{grid-template-columns:repeat(5,1fr)}
.meal-btn,.food-btn,.mood-btn{border:1px solid var(--line);background:#fff;border-radius:17px;color:var(--text);cursor:pointer}.meal-btn{padding:11px}.food-btn{min-height:67px;padding:9px 6px}.mood-btn{padding:9px 3px}.selected{border-color:var(--accent)!important;background:var(--accent2)!important}
.icon,.emoji{display:block}.meal-btn .icon{font-size:22px}.food-btn .icon{font-size:23px;margin-bottom:3px}.mood-btn .emoji{font-size:27px}.label{display:block;font-size:11px;font-weight:750}.mood-btn .label{font-size:9px;color:var(--muted);margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;min-height:25px}.chip{background:#f7efeb;border:1px solid #eaded8;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}.empty{font-size:11px;color:var(--muted)}
.save{width:100%;border:0;border-radius:18px;background:var(--accent);color:#fff;padding:15px;font-weight:850;cursor:pointer}.save:disabled{opacity:.45}
.history{display:grid;gap:9px;margin-top:12px}.entry{border:1px solid var(--line);border-radius:17px;background:#fffdfa;padding:11px}.top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.main{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-top:5px}.foods{font-size:13px;font-weight:800;line-height:1.4}.mood{font-size:25px}
.note{font-size:10px;color:var(--muted);text-align:center;margin-top:13px}.toast{position:fixed;left:50%;bottom:18px;transform:translate(-50%,20px);background:#2f2a28;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
.admin-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 9px;font-size:11px;cursor:pointer;color:var(--text)}
@media(max-width:430px){.app{padding:13px 11px 28px}.food-grid{grid-template-columns:repeat(2,1fr)}.mood-grid{grid-template-columns:repeat(5,1fr)}h1{font-size:28px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div><div class="eyebrow">Private food tracker</div><h1>Makan Yuk ❤️</h1><div class="date" id="todayLabel"></div></div>
  <div><div class="badge" id="todayCount">0 catatan</div><button class="admin-btn" id="refreshBtn" style="margin-top:7px">↻ Refresh</button></div>
</header>

<section class="card">
<h2 class="section-title">Kamu sedang makan apa?</h2><p class="section-sub">Pilih waktu makan.</p>
<div class="grid meal-grid" id="mealGrid"></div>
</section>

<section class="card">
<h2 class="section-title">Makanannya apa saja?</h2><p class="section-sub">Boleh pilih lebih dari satu.</p>
<div class="grid food-grid" id="foodGrid"></div>
<div class="chips" id="selectedFoods"></div>
</section>

<section class="card">
<h2 class="section-title">Mood kamu sekarang?</h2><p class="section-sub">Pilih yang paling mendekati.</p>
<div class="grid mood-grid" id="moodGrid"></div>
</section>

<section class="card"><button id="saveBtn" class="save" disabled>Simpan ❤️</button></section>

<section class="card">
<h2 class="section-title">Riwayat terbaru</h2>
<p class="section-sub">Data berasal dari database online.</p>
<div class="history" id="historyList"></div>
</section>
<div class="note">V2 • Online database</div>
</main>
<div class="toast" id="toast">Tersimpan ❤️</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const cfg = window.APP_CONFIG || {};
if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
  document.body.innerHTML = '<div style="padding:30px;font-family:system-ui">Konfigurasi Supabase belum diisi. Buka <b>config.js</b>, isi SUPABASE_URL dan SUPABASE_ANON_KEY, lalu deploy ulang.</div>';
  throw new Error("Missing Supabase configuration");
}
const db = supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);

const meals=[{id:"breakfast",icon:"🌤️",label:"Sarapan"},{id:"lunch",icon:"☀️",label:"Makan siang"},{id:"dinner",icon:"🌙",label:"Makan malam"},{id:"snack",icon:"🍪",label:"Snack"}];
const foods=[
{id:"rice",icon:"🍚",label:"Nasi"},{id:"chicken",icon:"🍗",label:"Ayam"},{id:"egg",icon:"🍳",label:"Telur"},
{id:"fish",icon:"🐟",label:"Ikan"},{id:"beef",icon:"🥩",label:"Daging"},{id:"noodles",icon:"🍜",label:"Mie"},
{id:"bread",icon:"🍞",label:"Roti"},{id:"vegetable",icon:"🥬",label:"Sayur"},{id:"fruit",icon:"🍎",label:"Buah"},
{id:"soup",icon:"🍲",label:"Sup"},{id:"cake",icon:"🍰",label:"Kue"},{id:"chocolate",icon:"🍫",label:"Cokelat"},
{id:"coffee",icon:"☕",label:"Kopi"},{id:"tea",icon:"🍵",label:"Teh"},{id:"milk",icon:"🥛",label:"Susu"}];
const moods=[
{id:"happy",emoji:"😊",label:"Senang"},{id:"love",emoji:"🥰",label:"Bahagia"},{id:"good",emoji:"🙂",label:"Biasa"},
{id:"neutral",emoji:"😐",label:"Netral"},{id:"tired",emoji:"😴",label:"Capek"},{id:"sad",emoji:"😞",label:"Sedih"},
{id:"angry",emoji:"😡",label:"Kesal"},{id:"stressed",emoji:"😩",label:"Stres"},{id:"sick",emoji:"🤢",label:"Tidak enak"},
{id:"excited",emoji:"🤩",label:"Semangat"}];

let state={meal:"",foods:new Set(),mood:""};

const el=id=>document.getElementById(id);
const fmtDate=d=>new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(d);
const todayKey=()=>new Date().toISOString().slice(0,10);

function render(){
  el("todayLabel").textContent=fmtDate(new Date());
  el("mealGrid").innerHTML=meals.map(x=>`<button class="meal-btn ${state.meal===x.id?"selected":""}" data-meal="${x.id}"><span class="icon">${x.icon}</span><span class="label">${x.label}</span></button>`).join("");
  el("foodGrid").innerHTML=foods.map(x=>`<button class="food-btn ${state.foods.has(x.id)?"selected":""}" data-food="${x.id}"><span class="icon">${x.icon}</span><span class="label">${x.label}</span></button>`).join("");
  const selected=foods.filter(x=>state.foods.has(x.id));
  el("selectedFoods").innerHTML=selected.length?selected.map(x=>`<span class="chip">${x.icon} ${x.label}</span>`).join(""):`<span class="empty">Belum ada makanan yang dipilih.</span>`;
  el("moodGrid").innerHTML=moods.map(x=>`<button class="mood-btn ${state.mood===x.id?"selected":""}" data-mood="${x.id}"><span class="emoji">${x.emoji}</span><span class="label">${x.label}</span></button>`).join("");
  el("saveBtn").disabled=!(state.meal&&state.foods.size&&state.mood);
}

function showToast(t){const x=el("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1600)}

async function loadHistory(){
  el("historyList").innerHTML='<div class="empty">Memuat data...</div>';
  const {data,error}=await db.from("food_logs").select("*").order("eaten_at",{ascending:false}).limit(20);
  if(error){console.error(error);el("historyList").innerHTML='<div class="empty">Gagal mengambil data. Cek konfigurasi/database.</div>';return}
  const today=data.filter(x=>x.eaten_at.slice(0,10)===todayKey()).length;
  el("todayCount").textContent=`${today} catatan`;
  el("historyList").innerHTML=data.length?data.map(x=>{
    const meal=meals.find(m=>m.id===x.meal_type), mood=moods.find(m=>m.id===x.mood_id);
    const names=(x.food_ids||[]).map(id=>foods.find(f=>f.id===id)).filter(Boolean).map(f=>f.icon+" "+f.label).join(" · ");
    const time=new Date(x.eaten_at).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    return `<div class="entry"><div class="top"><span>${meal?meal.icon+" "+meal.label:x.meal_type}</span><span>${time}</span></div><div class="main"><div class="foods">${names}</div><div class="mood">${mood?mood.emoji:"🙂"}</div></div></div>`;
  }).join(""):'<div class="empty">Belum ada catatan.</div>';
}

document.addEventListener("click",async e=>{
  const m=e.target.closest("[data-meal]"); if(m){state.meal=m.dataset.meal;render();return}
  const f=e.target.closest("[data-food]"); if(f){state.foods.has(f.dataset.food)?state.foods.delete(f.dataset.food):state.foods.add(f.dataset.food);render();return}
  const mo=e.target.closest("[data-mood]"); if(mo){state.mood=mo.dataset.mood;render();return}
  if(e.target.closest("#refreshBtn")){await loadHistory();return}
  if(e.target.closest("#saveBtn")){
    const {error}=await db.from("food_logs").insert({meal_type:state.meal,food_ids:[...state.foods],mood_id:state.mood,eaten_at:new Date().toISOString()});
    if(error){console.error(error);showToast("Belum tersimpan — cek database");return}
    state={meal:"",foods:new Set(),mood:""};render();await loadHistory();showToast("Tersimpan ❤️");
  }
});
render(); loadHistory();
</script>
</body>
</html>
